<body>
  <h1>Hang</h1>
  <p>This page stops answering once it has loaded.</p>
  <script>
    // As an app does when its JavaScript loops for ever: nothing on the page answers again, a read of it included.
    addEventListener('load', () => setTimeout(() => { for (;;) {} }, 0));
  </script>
